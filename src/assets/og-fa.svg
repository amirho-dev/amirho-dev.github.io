<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>AmirHo — توسعه‌دهنده فول‌استک، موبایل و مهندس هوش مصنوعی</title>
  <!-- Hand-authored Open Graph artwork (FA) — rasterized to /og-fa.png
       by scripts/generate-og.mjs. Fonts: JetBrains Mono (terminal
       chrome + Latin brand mark) · Vazirmatn (Farsi copy). Directional
       contract mirrors the site's own design language (§7.4): terminal
       chrome and the Latin brand mark stay LTR on the inline-start
       side; human-language lines are RTL, right-anchored at the
       window's inline-end (x=1062, direction=rtl, anchor=start). -->
  <defs>
    <linearGradient id="brand-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9F00"/>
      <stop offset="1" stop-color="#F4631E"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- terminal window -->
  <rect x="90" y="80" width="1020" height="470" rx="16" fill="#0C1219" stroke="#22303D" stroke-width="2"/>
  <path d="M90 96a16 16 0 0 1 16-16h988a16 16 0 0 1 16 16v40H90z" fill="#16212B"/>
  <line x1="90" y1="136" x2="1110" y2="136" stroke="#22303D" stroke-width="2"/>
  <circle cx="122" cy="108" r="7" fill="#FF5F57"/>
  <circle cx="148" cy="108" r="7" fill="#FEBC2E"/>
  <circle cx="174" cy="108" r="7" fill="#28C840"/>
  <text x="206" y="115" font-family="'JetBrains Mono', monospace" font-size="17" fill="#93A7B4">amirho@portfolio — bash</text>

  <!-- whoami (LTR terminal chrome) -->
  <text x="138" y="208" font-family="'JetBrains Mono', monospace" font-size="26">
    &lt;tspan fill="#FE7743"&gt;
    <tspan fill="#FE7743">$</tspan><tspan fill="#93A7B4" dx="10">whoami</tspan>
  lt;/tspan&gt;&lt;tspan fill="#93A7B4" dx="10"&gt;whoami&lt;/tspan&gt;
  </text>

  <!-- brand mark (LTR, Latin) -->
  <text x="138" y="322" font-family="'JetBrains Mono', monospace" font-size="100" font-weight="700">
    &lt;tspan fill="#FE7743"&gt;~/&lt;/tspan&gt;&lt;tspan fill="#EFEEEA"&gt;AmirHo&lt;/tspan&gt;
  </text>

  <!-- role line (RTL, right-anchored) -->
  <text x="1062" y="396" direction="rtl" text-anchor="start" font-family="Vazirmatn, sans-serif" font-size="36" font-weight="700" fill="#EFEEEA">توسعه‌دهنده فول‌استک، موبایل و مهندس هوش مصنوعی</text>

  <line x1="138" y1="428" x2="1062" y2="428" stroke="#22303D" stroke-width="2"/>

  <!-- tagline (RTL, explicit lines — SVG text does not wrap) -->
  <text x="1062" y="472" direction="rtl" text-anchor="start" font-family="Vazirmatn, sans-serif" font-size="24" fill="#93A7B4">محصولات دیجیتالِ سریع، دسترس‌پذیر و دوزبانه می‌سازم —</text>
  <text x="1062" y="504" direction="rtl" text-anchor="start" font-family="Vazirmatn, sans-serif" font-size="24" fill="#93A7B4">از پیکسل تا پروداکشن.</text>

  <!-- url (LTR machine text) -->
  <text x="90" y="598" font-family="'JetBrains Mono', monospace" font-size="26">
    &lt;tspan fill="#5E707E"&gt;https://&lt;/tspan&gt;&lt;tspan fill="#FE7743"&gt;amirho&lt;/tspan&gt;&lt;tspan fill="#5E707E"&gt;.github.io&lt;/tspan&gt;
  </text>

  <!-- brand strip (decorative only) -->
  <rect x="0" y="616" width="1200" height="14" fill="url(#brand-strip)"/>
</svg>