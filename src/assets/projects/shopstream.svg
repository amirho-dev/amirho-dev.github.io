    <text x="290" y="920" font-size="14" fill="#93A7B4">order.completed</text>
    <rect x="470" y="912" width="27" height="24" rx="6" fill="url(#shopstream-funnel)"/>
    <text x="511" y="930" font-size="14" fill="#EFEEEA">968 · 3.9%</text>

    <text x="1540" y="772" font-size="46" font-weight="700" fill="#FE7743" text-anchor="end">3.9%</text>
    <text x="1540" y="800" font-size="12" fill="#93A7B4" text-anchor="end">OVERALL CONVERSION</text>
