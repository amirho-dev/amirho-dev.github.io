<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="shopstream-title">
  <title id="shopstream-title">ShopStream — live e-commerce analytics dashboard mockup</title>
  <defs>
    <linearGradient id="shopstream-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FE7743" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FE7743" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shopstream-funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FE7743"/>
      <stop offset="1" stop-color="#F4631E"/>
