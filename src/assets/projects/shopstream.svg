    <line x1="1104" y1="396" x2="1540" y2="396" stroke="#1B2733"/>

    <text x="1104" y="420" font-size="13" fill="#93A7B4">13:54:52</text>
    <text x="1180" y="420" font-size="13" fill="#309898">order.completed</text>
    <text x="1540" y="420" font-size="13" fill="#EFEEEA" text-anchor="end">+ €129.90</text>
