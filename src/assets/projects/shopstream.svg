  <rect x="14" y="162" width="4" height="34" rx="2" fill="#FE7743"/>
  <g fill="#FE7743">
    <rect x="30" y="171" width="8" height="8" rx="1"/>
    <rect x="40" y="171" width="8" height="8" rx="1"/>
    <rect x="30" y="181" width="8" height="8" rx="1"/>
    <rect x="40" y="181" width="8" height="8" rx="1"/>
