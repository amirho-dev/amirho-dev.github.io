  <line x1="34" y1="222" x2="42" y2="222" stroke="#93A7B4" stroke-width="1.5"/>
  <line x1="34" y1="228" x2="42" y2="228" stroke="#93A7B4" stroke-width="1.5"/>
  <text x="58" y="235" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#93A7B4">Orders</text>

