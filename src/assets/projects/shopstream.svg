    <text x="1540" y="456" font-size="13" fill="#93A7B4" text-anchor="end">/summer-sale</text>
    <line x1="1104" y1="468" x2="1540" y2="468" stroke="#1B2733"/>

    <text x="1104" y="492" font-size="13" fill="#93A7B4">13:44:03</text>
