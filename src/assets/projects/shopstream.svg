  </defs>

  <!-- canvas -->
  <rect width="1600" height="1000" fill="#0C1219"/>

  <!-- ── top bar ─────────────────────────────────────────────── -->
  <rect width="1600" height="60" fill="#16212B"/>
  <circle cx="30" cy="30" r="6" fill="#FF5F57"/>
  <circle cx="54" cy="30" r="6" fill="#FEBC2E"/>
  <circle cx="78" cy="30" r="6" fill="#28C840"/>
  <text x="110" y="37" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="17" fill="#93A7B4">shopstream — live commerce analytics</text>
  <rect x="1316" y="15" width="244" height="30" rx="15" fill="#309898" fill-opacity="0.14"/>
  <circle cx="1340" cy="30" r="4.5" fill="#309898"/>
  <text x="1354" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#309898">LIVE · 50K EVENTS/DAY</text>

  <!-- ── sidebar ──────────────────────────────────────────────── -->
  <rect x="0" y="60" width="230" height="940" fill="#0F1720"/>
  <line x1="230.5" y1="60" x2="230.5" y2="1000" stroke="#1E2B36"/>
  <rect x="22" y="86" width="30" height="30" rx="7" fill="#FE7743"/>
  <text x="37" y="107" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">S</text>
  <text x="64" y="107" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#EFEEEA">ShopStream</text>
  <line x1="22" y1="136" x2="208" y2="136" stroke="#1E2B36"/>

