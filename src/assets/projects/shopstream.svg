  <circle cx="38" cy="429" r="5.5" fill="none" stroke="#93A7B4" stroke-width="1.5"/>
  <line x1="38" y1="420" x2="38" y2="423" stroke="#93A7B4" stroke-width="1.5"/>
  <line x1="38" y1="435" x2="38" y2="438" stroke="#93A7B4" stroke-width="1.5"/>
  <line x1="29" y1="429" x2="32" y2="429" stroke="#93A7B4" stroke-width="1.5"/>
  <line x1="44" y1="429" x2="47" y2="429" stroke="#93A7B4" stroke-width="1.5"/>
  <text x="58" y="435" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" fill="#93A7B4">Settings</text>

