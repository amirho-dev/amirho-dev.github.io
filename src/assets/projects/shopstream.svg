    <text x="1540" y="312" font-size="13" fill="#EFEEEA" text-anchor="end">+ €86.00</text>
    <line x1="1104" y1="324" x2="1540" y2="324" stroke="#1B2733"/>

    <text x="1104" y="348" font-size="13" fill="#93A7B4">14:02:29</text>
