    <text x="1540" y="492" font-size="13" fill="#93A7B4" text-anchor="end">1 of 3 steps</text>
    <line x1="1104" y1="504" x2="1540" y2="504" stroke="#1B2733"/>

    <text x="1104" y="528" font-size="13" fill="#93A7B4">13:37:26</text>
    <text x="1180" y="528" font-size="13" fill="#309898">order.completed</text>
    <text x="1540" y="528" font-size="13" fill="#EFEEEA" text-anchor="end">+ €54.00</text>
    <line x1="1104" y1="540" x2="1540" y2="540" stroke="#1B2733"/>

    <text x="1104" y="564" font-size="13" fill="#93A7B4">13:31:59</text>
    <text x="1180" y="564" font-size="13" fill="#FEBC2E">inventory.low</text>
    <text x="1540" y="564" font-size="13" fill="#93A7B4" text-anchor="end">SKU-3319</text>
